[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-framework-arcade-orchestrator"
version = "0.1.0"
description = "Project 24: Google ADK orchestrator coordinating Strands, Pydantic AI, MAF, Agno, and Mastra workers in isolated folders with Playwright QA and bounded 1-shot repair."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "google-adk>=0.3.0",
    "pydantic>=2.6.0",
    "pydantic-ai>=0.0.14",
    "python-dotenv>=1.0.1",
    "playwright>=1.45.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
